  <path d="M282 267H332L361 296H442" stroke="#54d8ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="55" y="199" width="58" height="38" rx="12" fill="#10253a" stroke="#79e9ff" stroke-width="4"/>
