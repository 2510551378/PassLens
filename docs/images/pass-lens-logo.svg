<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pass Lens logo</title>
  <desc id="desc">A luminous lens inspecting a compiler pass pipeline with evidence rays and IR blocks.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#1d3650"/>
      <stop offset="54%" stop-color="#0d1725"/>
      <stop offset="100%" stop-color="#070b12"/>
    </radialGradient>
    <linearGradient id="lens" x1="142" y1="130" x2="370" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c8f7ff"/>
      <stop offset="0.28" stop-color="#5fdcff"/>
      <stop offset="0.62" stop-color="#1b7cff"/>
      <stop offset="1" stop-color="#0a2445"/>
    </linearGradient>
    <linearGradient id="amber" x1="96" y1="249" x2="416" y2="249" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffbd5a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffbd5a"/>
      <stop offset="1" stop-color="#ffbd5a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.08 0 0 0 0 0.7 0 0 0 0 1 0 0 0 0.65 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
