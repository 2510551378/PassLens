  <circle cx="260" cy="258" r="86" fill="url(#lens)" stroke="#d6fbff" stroke-width="6" filter="url(#glow)"/>
  <circle cx="260" cy="258" r="57" fill="#07101b" fill-opacity="0.62" stroke="#88efff" stroke-width="2"/>
  <circle cx="230" cy="218" r="18" fill="#f6feff" fill-opacity="0.85"/>
  <path d="M213 308C242 333 302 330 329 289" stroke="#b9f7ff" stroke-width="8" stroke-linecap="round" opacity="0.52"/>

