<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pass Lens hero banner</title>
  <desc id="desc">A compiler pass pipeline flows through an inspecting lens, exposing first signal, IR diff, metrics, diagnostics, and repro context.</desc>
  <defs>
    <radialGradient id="halo" cx="62%" cy="44%" r="58%">
      <stop offset="0%" stop-color="#155b7a" stop-opacity="0.95"/>
      <stop offset="42%" stop-color="#0d2236" stop-opacity="0.84"/>
      <stop offset="100%" stop-color="#080c14"/>
    </radialGradient>
    <linearGradient id="rail" x1="129" y1="270" x2="1104" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ddfff" stop-opacity="0.06"/>
      <stop offset="0.22" stop-color="#4ddfff"/>
      <stop offset="0.48" stop-color="#ffbd5a"/>
      <stop offset="0.76" stop-color="#4ddfff"/>
      <stop offset="1" stop-color="#4ddfff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#18304a"/>
      <stop offset="1" stop-color="#0d1828"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.05 0 0 0 0 0.76 0 0 0 0 1 0 0 0 0.58 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>

