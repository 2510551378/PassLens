  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="86" y="110" fill="#f1fbff" font-size="54" font-weight="750" letter-spacing="0">Pass Lens</text>
    <text x="88" y="154" fill="#9eddec" font-size="22" font-weight="500">Evidence-driven postmortem debugger for MLIR / LLVM pass pipelines</text>
    <text x="88" y="458" fill="#c7f7ff" font-size="20" font-weight="650">first signal</text>
    <text x="238" y="458" fill="#c7f7ff" font-size="20" font-weight="650">IR diff</text>
