  <rect width="1280" height="560" rx="40" fill="url(#halo)"/>
  <path d="M0 433C147 387 274 382 414 410C578 443 723 496 890 467C1017 445 1129 388 1280 394V560H0V433Z" fill="#050811" fill-opacity="0.62"/>

