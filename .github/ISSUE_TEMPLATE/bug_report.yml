name: Bug report
description: Report a Pass Lens viewer, command, collector, or packaging problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Pass Lens. Please keep reports trace-grounded when possible: include the command, trace shape, artifacts, and the first visible failure.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: Pass Lens failed to open an artifact-backed trace generated by ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Exact steps, command palette actions, or collector command lines.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Trace evidence
      description: Paste the relevant summary, trace quality report, trace size report, diagnostics, or repro bundle path.
      placeholder: |
        First signal:
        Trace quality:
        Trace size:
        Diagnostics:
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Pass Lens version / commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: false
  - type: input
    id: vscode
    attributes:
      label: VS Code version
      placeholder: 1.90.0
    validations:
      required: false
  - type: dropdown
    id: trace_source
    attributes:
      label: Trace source
      options:
        - Structured MLIR collector
        - mlir-opt dump fallback
        - Downstream compiler JSON
        - Built-in sample trace
        - Unknown / not applicable
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Attach screenshots, output logs, or a redacted trace/repro bundle when possible.
    validations:
      required: false
